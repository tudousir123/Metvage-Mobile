name: Jest (unit tests)

on:
  push:
    branches: [ main, codex/metvage-v1 ]
  pull_request:
  workflow_dispatch:

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🏗 Enable corepack
        run: corepack enable

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run jest unit tests
        run: npm run test:ci

      - name: Run acceptance tooling contracts
        run: npm run test:acceptance
